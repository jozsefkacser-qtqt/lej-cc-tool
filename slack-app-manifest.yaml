# Slack app manifest for lej-cc-tool.
#
# Create the app from this file:
#   https://api.slack.com/apps  ->  Create New App  ->  From a manifest
#   -> pick the workspace -> paste this YAML -> Create
#
# Socket Mode is enabled, so there are no request URLs to configure and the
# bot needs no public endpoint or inbound firewall rule.
display_information:
  name: AWB Customs Tracker
  description: Tracks customs-clearance completeness of master air waybills at LEJ
  background_color: "#1f3b57"
  long_description: |
    Post a master air waybill in Slack and the bot reports how much of it has
    cleared customs. It checks immediately, again after 15 minutes, then every
    30 minutes until everything is cleared, attaching PortGround's shipment
    status workbook with each update. Several AWBs are tracked in parallel.

features:
  bot_user:
    display_name: AWB Tracker
    always_online: true
  slash_commands:
    - command: /awb
      description: Track customs clearance for a master AWB
      usage_hint: 488-20744846 | list | stop <awb> | help
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands           # receive /awb
      - chat:write         # post status updates
      - chat:write.public  # post in channels the bot was not invited to
      - files:write        # attach the downloaded workbook
      - app_mentions:read  # respond to @AWB Tracker 488-20744846
      # Seeing channel messages is what lets the bot answer a command Slack
      # turned into ordinary text -- "/ awb 936-02134215", with a space after
      # the slash, is not a command, and without these the attempt is
      # invisible to the bot and silent to the person who made it.
      - channels:history   # public channels
      - groups:history     # private channels the bot is in
      - im:history         # direct messages to the bot
      - mpim:history       # group direct messages
      # Pins the short "post a number here" explainer at the top of an
      # auto-detect channel, so the instruction is where people already are.
      - pins:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true       # required for the Refresh / Stop buttons
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
