# Maps the raw "Final Status" column of PortGround's export onto the buckets
# the bot reports. Matching is case-insensitive and whitespace-collapsed.
#
# Anything not listed here lands in OTHER and is reported explicitly in Slack
# with its raw value. That is deliberate: if PortGround introduces a status
# like "blocked" or "seized", we want to see it the first time it appears
# rather than silently miscount it. When a new value shows up, add it below.
#
# Reference exports checked 2026-09-07: 48820744846 (225 rows, all "cleared")
# and 93600333955 (1605 rows, all "not cleared"). Those are the only two
# values observed so far.

cleared:
  - cleared

not_cleared:
  - not cleared
  - ""          # blank Final Status = registered but not yet processed

# Customs has taken the shipment for examination. Not cleared -- but not an
# unworked shipment either, so the bot counts it apart from "open": nobody
# here can move it, and an AWB waiting on three inspections should not read
# as an AWB with three shipments nobody has touched.
#
# IMPORTANT: PortGround does not put this in Final Status. It leaves Final
# Status at "not cleared" and records the examination in the **External
# Statuses** column, so the parser reads that column too and upgrades a
# "not cleared" row to INSPECTION when it names one. "cleared" always wins:
# a shipment released after an examination keeps the note in its history.
#
# Observed on live AWBs (93602928693, OyTM202608277404, OyTM202608274493):
#   inspection        physical examination
#   inspection_doc    document check
# External Statuses is plural and can list several values in one cell, so
# any value *containing* the word is treated as an inspection even when it
# is not listed here, and logged once so the exact wording can be added.
inspection:
  - inspection
  - inspection_doc
  - marked for inspection
  - customs inspection
  - physical inspection
  - selected for inspection
